    <title>Visibility and Opacity</title>

    <style>

        .visible {
            background-color: lightgreen;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background-color: red;
            padding: 20px;
        }

        .transparent {
            opacity: 0.3;
            background-color: blue;
            color: white;
            padding: 20px;
        }

    </style>
</head>
