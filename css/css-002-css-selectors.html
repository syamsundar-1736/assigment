<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        /* Universal selector */
        * {
            font-family: Arial;
        }

        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .box {
            background-color: lightgreen;
            padding: 15px;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid blue;
        }

        /* Grouping selector */
        h2, p {
            text-align: center;
        }

    </style>
</head>
