<!DOCTYPE html>
<html>
<head>
    <title>CSS Filters</title>

    <style>
        img {
            width: 200px;
            margin: 10px;
        }

        .blur {
            filter: blur(5px);
        }

        .gray {
            filter: grayscale(100%);
        }

        .bright {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(200%);
        }

        .opacity {
            filter: opacity(40%);
        }
    </style>
</head>

<body>
