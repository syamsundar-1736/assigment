<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        body {
            height: 1000px;
        }

        .box {
            width: 150px;
            height: 80px;
            padding: 10px;
            margin: 20px;
            color: white;
        }

        .static {
            position: static;
            background: gray;
        }

        .relative {
            position: relative;
            left: 50px;
            background: blue;
        }

        .parent {
            position: relative;
            width: 300px;
            height: 150px;
            background: lightgray;
            margin: 20px;
        }

        .absolute {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: red;
        }

        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: green;
        }

        .sticky {
            position: sticky;
            top: 0;
            background: orange;
            padding: 20px;
        }
    </style>
</head>

<body>
