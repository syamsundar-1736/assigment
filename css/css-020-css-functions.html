<!DOCTYPE html>
<html>
<head>
    <title>CSS Functions</title>

    <style>

        .calc-box {
            width: calc(100% - 100px);
            background-color: lightblue;
            padding: 20px;
            margin: 20px;
        }

        .min-box {
            width: min(80%, 500px);
            background-color: lightgreen;
            padding: 20px;
            margin: 20px;
        }

        .max-box {
            width: max(50%, 300px);
            background-color: orange;
            padding: 20px;
            margin: 20px;
        }

        h1 {
            font-size: clamp(24px, 5vw, 50px);
            text-align: center;
        }

    </style>
</head>
<body>
