<!DOCTYPE html>
<html>
<head>
    <title>CSS Display</title>

    <style>

        .block {
            display: block;
            background-color: lightblue;
            padding: 10px;
        }

        .inline {
            display: inline;
            background-color: yellow;
        }

        .inline-block {
            display: inline-block;
            background-color: lightgreen;
            padding: 20px;
        }

        .flex {
            display: flex;
            gap: 10px;
        }

        .flex div {
            background-color: orange;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid div {
            background-color: pink;
            padding: 20px;
        }

        .none {
            display: none;
        }

    </style>
</head>
<body>
