<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Example</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
<div class="hcj-toolbar">
  <a class="hcj-btn" href="../index.html">Home</a>
  <a class="hcj-btn" href="index.html">HTML Programs</a>
  <span class="hcj-title">Bootstrap Example</span>
</div>
<div class="hcj-desc">Demonstrates using the Bootstrap framework to style buttons, alerts and a card.</div>
<style>
.hcj-toolbar, .hcj-toolbar * { box-sizing: border-box !important; }
.hcj-toolbar {
  display:flex !important; align-items:center !important; gap:10px !important;
  background:#1e293b !important; padding:12px 18px !important;
  font-family: Arial, Helvetica, sans-serif !important; flex-wrap: wrap !important;
}
.hcj-btn { color:#ffffff !important; background:#334155 !important; text-decoration:none !important;
  padding:6px 14px !important; border-radius:6px !important; font-size:14px !important; }
.hcj-btn:hover { background:#475569 !important; }
.hcj-title { color:#ffffff !important; font-weight:bold !important; font-size:16px !important; margin-left:auto !important; }
.hcj-desc { background:#f1f5f9 !important; color:#334155 !important; padding:10px 18px !important;
  font-family: Arial, Helvetica, sans-serif !important; font-size:14px !important; margin:0 !important; }
.hcj-divider { border:none !important; border-top:2px solid #e2e8f0 !important; margin:0 0 15px 0 !important; }
</style>
<hr class="hcj-divider">


<div class="container mt-5">

    <h1 class="text-primary text-center">
        Bootstrap Webpage
    </h1>

    <div class="alert alert-success">
        Welcome to my webpage!
    </div>

    <button class="btn btn-primary">
        Click Me
    </button>

    <button class="btn btn-danger">
        Delete
    </button>

    <div class="card mt-4" style="width: 18rem;">

        <div class="card-body">

            <h5 class="card-title">
                Student Card
            </h5>

            <p class="card-text">
                This is a Bootstrap card component.
            </p>

            <a href="#" class="btn btn-primary">
                View More
            </a>

        </div>

    </div>

</div>


<hr class="hcj-divider">
