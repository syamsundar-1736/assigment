<h1>2. Retrieve localStorage</h1><input id="value" placeholder="Enter data"><button id="action">Save</button><button id="read">Read</button><button id="clear">Clear</button><p id="out"></p><script>action.onclick=()=>{localStorage.setItem('data',value.value);out.textContent='Saved';};read.onclick=()=>out.textContent=localStorage.getItem('data')||'No data';clear.onclick=()=>{localStorage.clear();out.textContent='Storage cleared';};</script><hr class="hcj-divider">
