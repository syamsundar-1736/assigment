<h1>14. Reset Event</h1><button id="action">Perform Action</button><input id="field" placeholder="Type here"><div id="box" style="padding:30px;border:1px solid #999;margin:10px">Interactive area</div><p id="out"></p><script>const out=document.getElementById('out'),box=document.getElementById('box'),action=document.getElementById('action'),field=document.getElementById('field');
action.onclick=()=>out.textContent='onclick executed'; action.ondblclick=()=>out.textContent='Double click executed';
box.onmouseover=()=>out.textContent='Mouse over';box.onmouseout=()=>out.textContent='Mouse out';
box.onmousedown=()=>out.textContent='Mouse down';box.onmouseup=()=>out.textContent='Mouse up';
box.onmousemove=e=>out.textContent='X: '+e.clientX+', Y: '+e.clientY;
field.onkeydown=e=>out.textContent='Key down: '+e.key;field.onkeyup=e=>out.textContent='Key up: '+e.key;
field.oninput=()=>out.textContent=field.value;field.onfocus=()=>out.textContent='Focused';field.onblur=()=>out.textContent='Blurred';
document.addEventListener('keydown',e=>{if(e.key==='Enter')out.textContent='Enter pressed';});</script><hr class="hcj-divider">
