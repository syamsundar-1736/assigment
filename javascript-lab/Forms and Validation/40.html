<hr class="hcj-divider">
<h1>40. Validation Without Reload</h1><form id="form"><label>Name: <input id="name" required></label><br><label>Email: <input id="email" type="email" required></label><br><label>Password: <input id="password" type="password" required minlength="6"></label><br><button>Submit</button></form><p id="out"></p><script>form.onsubmit=e=>{e.preventDefault();if(form.checkValidity()){out.textContent='Form submitted successfully';out.className='success'}else{out.textContent='Please correct the fields';out.className='error'}};</script><hr class="hcj-divider">
